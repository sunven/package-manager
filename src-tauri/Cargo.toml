[package]
name = "package-manager-control-center"
version = "0.1.0"
description = "Local package manager control center"
authors = ["sunven"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "package_manager_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "~2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
roxmltree = "0.20"
toml_edit = { version = "0.25", features = ["serde"] }
regex = "1"
tempfile = "3"
sha2 = "0.10"
tar = "0.4"
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
