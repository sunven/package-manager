<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7eef8" />
    <title>插件市场 · 合成数据验证</title>
  </head>
  <body>
    <div id="app"></div>
    <aside role="note" style="position:fixed;right:12px;bottom:8px;z-index:60;padding:4px 8px;background:#182235;color:white;border-radius:4px;font:12px sans-serif">合成数据验证 · 不连接本机 Codex</aside>
    <script type="module">
      import { codexMarketplaceFixture } from "/src/test/codexMarketplaceFixtures.ts";
      import { codexPluginFixture } from "/src/test/codexPluginFixtures.ts";
      import { codexHookScanFixture } from "/src/test/codexHookFixtures.ts";
      import { managerFixture } from "/src/test/fixtures.ts";

      const state = window.codexReview = {
        markets: codexMarketplaceFixture(), plugins: codexPluginFixture(),
        marketError: null, pluginError: null, calls: [],
      };
      state.plugins.plugins = state.plugins.plugins.map((plugin) => {
        const marketplaceName = plugin.marketplaceName === "personal" ? "team-tools" : "managed-tools";
        return { ...plugin, marketplaceName, pluginId: `${plugin.name}@${marketplaceName}` };
      });
      state.plugins.plugins.push({ ...state.plugins.plugins[0], name: "orphan", pluginId: "orphan@gone-tools", marketplaceName: "gone-tools" });
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        invoke: async (command, args = {}) => {
          state.calls.push({ command, args });
          if (command === "plugin:path|resolve_directory") return "/Users/example";
          if (command === "plugin:window|set_theme") return;
          if (command === "get_project_cleanup_settings") return { presets: [], activePresetId: null };
          if (command === "scan_manager") return { manager: managerFixture("Npm", { paths: [] }), scanDurationMs: 1, diagnostics: [] };
          if (command === "scan_codex_marketplaces") {
            if (state.marketError) throw new Error(state.marketError);
            return structuredClone(state.markets);
          }
          if (command === "scan_codex_plugins") {
            if (state.pluginError) throw new Error(state.pluginError);
            return structuredClone(state.plugins);
          }
          if (command === "scan_codex_hooks") return codexHookScanFixture();
          if (command === "set_codex_plugin_enabled") {
            const plugin = state.plugins.plugins.find((plugin) => plugin.pluginId === args.request.pluginId);
            plugin.defaultEnabled = args.request.enabled;
            return { status: "Saved", message: "配置已保存，请在新会话中验证。" };
          }
          if (command === "change_codex_marketplace") {
            if (args.request.operation === "Remove") state.markets.marketplaces = state.markets.marketplaces.filter((market) => market.id !== args.request.marketplaceId);
            return { status: "Succeeded", message: "市场操作已完成，请核对清单。", executed: true };
          }
          throw new Error(`Review does not implement: ${command}`);
        },
      };
      localStorage.setItem("package-manager.enabledManagers", '["Npm"]');
      localStorage.setItem("package-manager.migratedFvm", "1");
      await import("/src/main.tsx");
    </script>
  </body>
</html>
