<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Codex Skills · 合成数据验证</title></head>
<body><div id="app"></div><aside role="note" style="position:fixed;right:12px;bottom:8px;z-index:60;padding:4px 8px;background:#182235;color:white;border-radius:4px;font:12px sans-serif">合成数据验证 · 不连接本机 Codex</aside>
<script type="module">
import { codexSkillsFixture } from "/src/test/codexSkillFixtures.ts";
import { codexMarketplaceFixture } from "/src/test/codexMarketplaceFixtures.ts";
import { codexPluginFixture } from "/src/test/codexPluginFixtures.ts";
import { codexHookScanFixture } from "/src/test/codexHookFixtures.ts";
import { managerFixture } from "/src/test/fixtures.ts";
const state = window.skillsReview = { scan: codexSkillsFixture(), error: null, plan: null, calls: [] };
const plugins = codexPluginFixture();
plugins.plugins = plugins.plugins.map(plugin => ({ ...plugin, marketplaceName: "team-tools", pluginId: `${plugin.name}@team-tools` }));
plugins.plugins = [plugins.plugins[0]];
window.__TAURI_INTERNALS__ = {
  metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
  invoke: async (command, args = {}) => {
    state.calls.push({ command, args });
    if (command === "plugin:path|resolve_directory") return "/Users/example";
    if (command === "plugin:window|set_theme") return;
    if (command === "get_project_cleanup_settings") return { presets: [], activePresetId: null };
    if (command === "scan_manager") return { manager: managerFixture("Npm", { paths: [] }), scanDurationMs: 1, diagnostics: [] };
    if (command === "scan_codex_marketplaces") return codexMarketplaceFixture();
    if (command === "scan_codex_plugins") return plugins;
    if (command === "scan_codex_hooks") return codexHookScanFixture();
    if (command === "scan_codex_skills") { if (state.error) throw new Error(state.error); return structuredClone(state.scan); }
    if (command === "read_codex_skill") return "---\nname: release-notes\ndescription: 整理提交记录，编写版本说明。\n---\n\n# Release notes\n\n1. 阅读本次发布的提交。\n2. 按变更类型编写说明。\n3. 保留来源链接供读者核对。";
    if (command === "choose_codex_marketplace_directory") return "/Users/example/skills/release-notes";
    if (command === "prepare_codex_skill") {
      const request = args.request;
      const skill = state.scan.skills.find(skill => skill.path === request.path) ?? state.scan.skills[0];
      return state.plan = { planId: "preview-1", operation: request.operation, name: skill.name, path: skill.path,
        sourceLabel: skill.sourceLabel, revision: skill.revision, enabled: request.operation === "Disable" ? false : skill.enabled,
        message: request.operation === "Uninstall" ? "整份安装副本（包括本地修改）移入废纸篓，保留原始来源。清空废纸篓前可找回。" : "只修改 Codex 的技能启用设置，保留技能文件；请在新会话中验证。" };
    }
    if (command === "cancel_codex_skill") { state.plan = null; return; }
    if (command === "commit_codex_skill") {
      const skill = state.scan.skills.find(skill => skill.path === state.plan.path);
      if (skill) skill.enabled = state.plan.enabled;
      state.plan = null;
      return { status: "Saved", message: "启用设置已保存，请在新会话中验证。" };
    }
    throw new Error(`Fixture does not implement: ${command}`);
  }
};
localStorage.setItem("package-manager.enabledManagers", '["Npm"]');
localStorage.setItem("package-manager.migratedFvm", "1");
await import("/src/main.tsx");
</script></body></html>
